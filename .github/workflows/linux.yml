#
# Linux x86_64 build of Cably Desktop on GitHub Actions (ubuntu-24.04 runners).
#
# The recipe lives in cably/linux/ and is shared with the Docker build described in
# cably/linux/README.md: apt-packages.txt (what to install), build.sh (configure + ninja +
# install, incremental), run-tests.sh (unit tests, bridge.sh, theme.sh, launch under Xvfb)
# and package-deb.sh (the .deb).  This file only sequences them, adds a ccache in
# actions/cache and publishes the .deb: as a workflow artifact on every run, and as a
# GitHub Release asset on a v* tag.  Acceptance: cably/tests/linux-ci.sh.
#
# A cold KiCad build on a 4-vCPU runner takes roughly 2-3 hours; a warm ccache brings the
# compile down to tens of minutes.  Nothing here needs a secret: GITHUB_TOKEN only.

name: Linux (Cably Desktop)

on:
  push:
    branches: [cably-main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run per ref; a newer push cancels the (long) build still in flight.
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CABLY_PREFIX: /opt/cably-desktop
  CCACHE_DIR: /home/runner/.cache/ccache

jobs:
  # Fast, no compiler: the fork's own invariants (GPL headers on every changed source
  # file, no secret-like strings, the trademark rule) and this workflow's acceptance test.
  lint:
    name: Lint (headers, trademark, workflow)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-gpl-headers.sh diffs against the upstream tag 10.0.6

      - name: Install actionlint and PyYAML
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo install -m 0755 ./actionlint /usr/local/bin/actionlint
          sudo apt-get install -y --no-install-recommends python3-yaml shellcheck

      - name: GPL headers + secret scan (cably/scripts/check-gpl-headers.sh)
        run: bash cably/scripts/check-gpl-headers.sh

      - name: Trademark rule (the product is Cably Desktop; KiCad is attribution only)
        run: |
          set -euo pipefail
          MARK="Cably K"; MARK="${MARK}iCad"   # assembled so this file never carries the phrase
          if git grep -n "$MARK" -- .; then echo "trademark: product name followed by the KiCad mark"; exit 1; fi
          echo "trademark grep empty"

      - name: Workflow acceptance test (cably/tests/linux-ci.sh)
        run: bash cably/tests/linux-ci.sh

  build:
    name: Build, test, package (.deb, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      deb: ${{ steps.deb.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # KiCad's CreateGitVersionHeader.cmake runs `git describe`

      # The hosted runner has ~20 GB free on /; a RelWithDebInfo KiCad tree needs ~15 GB,
      # so the toolcaches go and the build tree lives on the larger /mnt scratch disk.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / /mnt 2>/dev/null || df -h /

      - name: Install build dependencies (cably/linux/apt-packages.txt)
        run: |
          set -euo pipefail
          sudo apt-get update
          grep -vE '^\s*(#|$)' cably/linux/apt-packages.txt | xargs sudo apt-get install -y --no-install-recommends
          sudo apt-get install -y --no-install-recommends ccache   # CI-only: the compile cache
          echo "gcc $(gcc -dumpfullversion), $(cmake --version | head -1), ninja $(ninja --version), $(ccache --version | head -1)"

      # The CABLY_* knobs every script reads (cably/linux/build.sh documents them), once,
      # into the job environment.  The .deb lands in CABLY_DEB_DIR; the theme.sh fixtures
      # (a board + schematic named blinking-led.*) come from cably/tests/fixtures/ when the
      # checkout has them, else from KiCad's own ecc83 demo (any board with F.Cu copper and
      # any schematic with wires exercises the theme).
      - name: Work directories, fixtures, compiler id
        id: setup
        run: |
          set -euo pipefail
          if [ -d /mnt ] && sudo mkdir -p /mnt/cably-build && sudo chown "$(id -u):$(id -g)" /mnt/cably-build; then
            BUILD=/mnt/cably-build
          else
            BUILD="$RUNNER_TEMP/cably-build"; mkdir -p "$BUILD"
          fi
          sudo mkdir -p "$CABLY_PREFIX" && sudo chown "$(id -u):$(id -g)" "$CABLY_PREFIX"
          mkdir -p "$CCACHE_DIR" "$RUNNER_TEMP/deb"
          if [ -f cably/tests/fixtures/blinking-led.kicad_pcb ] && [ -f cably/tests/fixtures/blinking-led.kicad_sch ]; then
            FIX="$GITHUB_WORKSPACE/cably/tests/fixtures"
          else
            FIX="$RUNNER_TEMP/fixtures"; mkdir -p "$FIX"
            cp demos/ecc83/ecc83-pp.kicad_pcb "$FIX/blinking-led.kicad_pcb"
            cp demos/ecc83/ecc83-pp.kicad_sch "$FIX/blinking-led.kicad_sch"
          fi
          {
            echo "CABLY_FORK=$GITHUB_WORKSPACE"
            echo "CABLY_BUILD_DIR=$BUILD"
            echo "CABLY_JOBS=$(nproc)"
            echo "CABLY_DEB_DIR=$RUNNER_TEMP/deb"
            echo "CABLY_FIXTURES=$FIX"
            echo "CABLY_CMAKE_EXTRA=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"
          echo "compiler=gcc$(gcc -dumpfullversion)-$(gcc -dumpmachine)" >> "$GITHUB_OUTPUT"
          echo "build dir: $BUILD ($(nproc) cpus); fixtures: $FIX"; ls -l "$FIX"

      # Keyed on the compiler and every CMakeLists/cmake module; the sha suffix makes each
      # run save its (grown) cache while restore-keys fall back to the newest prefix match.
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-ubuntu24.04-${{ steps.setup.outputs.compiler }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cably/**/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu24.04-${{ steps.setup.outputs.compiler }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cably/**/*.cmake') }}-
            ccache-ubuntu24.04-${{ steps.setup.outputs.compiler }}-

      - name: Configure ccache
        run: |
          set -euo pipefail
          ccache --set-config=max_size=4G --set-config=compression=true
          ccache --zero-stats
          ccache --show-config | grep -E 'max_size|cache_dir'

      - name: Build + install (cably/linux/build.sh, -j$(nproc), ccache)
        run: |
          set -euo pipefail
          echo "CABLY_JOBS=$CABLY_JOBS CABLY_BUILD_DIR=$CABLY_BUILD_DIR CABLY_PREFIX=$CABLY_PREFIX"
          bash cably/linux/build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          { echo '### build.sh'; grep -E '^build\.sh:' "$RUNNER_TEMP/build.log" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          du -sh "$CABLY_BUILD_DIR" "$CABLY_PREFIX" "$CCACHE_DIR"

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      # Saved even when the build failed or a later step fails: a partial compile is never
      # thrown away (a run cancelled by the timeout skips this, like every other step).
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Tests under Xvfb (cably/linux/run-tests.sh)
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x800x24" bash cably/linux/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/tests.log"
          { echo '### run-tests.sh'; echo "- ok lines: $(grep -cE '^  ok' "$RUNNER_TEMP/tests.log" || true)"; grep -E '^  FAIL' "$RUNNER_TEMP/tests.log" | sed 's/^/- /' || true; } >> "$GITHUB_STEP_SUMMARY"

      - name: Package (cably/linux/package-deb.sh)
        id: deb
        run: |
          set -euo pipefail
          cd "$CABLY_DEB_DIR"
          bash "$CABLY_FORK/cably/linux/package-deb.sh"
          DEB=$(find "$CABLY_DEB_DIR" -maxdepth 2 -name '*.deb' | head -1)
          [ -n "$DEB" ] || { echo "package-deb.sh produced no .deb under $CABLY_DEB_DIR"; exit 1; }
          dpkg-deb --info "$DEB"
          dpkg-deb --field "$DEB" Package | grep -qi cably || { echo "Package field does not name cably"; exit 1; }
          echo "$(dpkg-deb --contents "$DEB" | wc -l) entries in $(basename "$DEB") ($(du -h "$DEB" | cut -f1))"
          echo "name=$(basename "$DEB")" >> "$GITHUB_OUTPUT"
          { echo '### package'; echo "- $(basename "$DEB") ($(du -h "$DEB" | cut -f1))"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: cably-desktop-linux-x86_64-deb
          path: ${{ runner.temp }}/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  # On a v* tag the same .deb becomes a Release asset (the one place this workflow writes
  # to the repository).
  release:
    name: GitHub Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cably-desktop-linux-x86_64-deb
          path: dist

      - name: List assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Cably Desktop ${{ github.ref_name }}
          files: dist/*.deb
          fail_on_unmatched_files: true
          body: |
            Linux x86_64 .deb for Ubuntu 24.04; based on KiCad; GPL-3.0-or-later; source = this repository

            Asset: `${{ needs.build.outputs.deb }}` — install with `sudo apt install ./<file>.deb`.
            Cably Desktop is a fork of KiCad (Copyright © The KiCad Developers); the complete corresponding
            source for this build is the tag `${{ github.ref_name }}` of this repository (see NOTICE.md and CHANGES.md).
