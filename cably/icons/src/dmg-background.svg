<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cably Desktop DMG window background (660x400, the Finder window of the
  installer image; rendered to .background.png by cably/toolchain/dmg/make-template.sh).
  Hand-authored: the Cably mark (same geometry as kicad.svg) and the install hint.
  Copyright (C) 2026 Cably <dev@cably.dev>.
  This file is free software: you can redistribute it and/or modify it under
  the terms of the GNU General Public License as published by the Free
  Software Foundation, either version 3 of the License, or (at your option)
  any later version. It is distributed WITHOUT ANY WARRANTY; see LICENSE.GPLv3.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A85FF"/>
      <stop offset="0.5" stop-color="#0073E6"/>
      <stop offset="1" stop-color="#0061C2"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F4FA"/>
    </linearGradient>
  </defs>
  <rect width="660" height="400" fill="url(#sky)"/>
  <!-- the Cably mark: a rounded tile carrying a cable-shaped C soldered into two pads (kicad.svg, 1024 -> 60 px) -->
  <g transform="translate(300 18) scale(0.05859375)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tile)"/>
    <path d="M 701 666 A 230 230 0 1 1 701 358" fill="none" stroke="#FFFFFF" stroke-width="130" stroke-linecap="round"/>
    <path d="M 701 666 A 230 230 0 1 1 701 358" fill="none" stroke="#0073E6" stroke-width="26" stroke-linecap="round"/>
    <circle cx="701" cy="666" r="95" fill="#FFFFFF"/><circle cx="701" cy="666" r="38" fill="#0073E6"/>
    <circle cx="701" cy="358" r="95" fill="#FFFFFF"/><circle cx="701" cy="358" r="38" fill="#0073E6"/>
  </g>
  <text x="330" y="112" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1B2430">Drag Cably Desktop to Applications</text>
  <!-- arrow between the app folder (centre x=165) and the Applications link (centre x=495), icon row y=170 -->
  <line x1="246" y1="170" x2="404" y2="170" stroke="#0073E6" stroke-width="6" stroke-linecap="round"/>
  <path d="M 384 150 L 410 170 L 384 190" fill="none" stroke="#0073E6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="384" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7A90">Free software under the GNU GPL v3 or later. Source code, notices and attribution: cably.dev and the About window</text>
</svg>
